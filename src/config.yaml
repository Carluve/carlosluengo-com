site:
  name: Carlos Luengo
  site: 'https://carlosluengo.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ""

# Default SEO metadata
metadata:
  title:
    default: Carlos Luengo
    template: '%s — Carlos Luengo'
  description: "Sr. Enterprise AE en Cloudflare (Digital Natives / Startups / ISVs). Doctorando en IA & Management (Universidad de Alcalá). Docente. Industria · Academia · Build."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Carlos Luengo
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: es
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
